log:
    log_dir: ./log
    log_name: xrtcserver
    # verbose debug info warning error
    log_level: verbose
    log_to_stderr: true
ice:
    # 云服务器部署：填公网 IP（网卡扫描得到的是内网 IP）
    # 本地联调：留空自动扫描网卡
    netcard: eth0
    ipv4_addr: 120.76.197.143
    min_port: 10025
    max_port: 65535
rtp_rtcp:
    # 单位ms
    rtcp_report_timer_interval: 100
